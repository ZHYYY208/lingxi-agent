name: lingxi

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingxi-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      PORT: "8000"
      DATA_DIR: /app/data
      DATABASE_URL: "jdbc:mysql://mysql:3306/lingxi?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DATABASE_USERNAME: lingxi
      DATABASE_PASSWORD: "${MYSQL_PASSWORD:-lingxi_pass}"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MILVUS_URI: "http://milvus:19530"
      MILVUS_COLLECTION: lingxi_chunks
      EMBEDDING_PROVIDER: local
      ENABLE_DEMO_SEED: "true"
      DEMO_STREAM_DELAY_MS: "14"
      LINGXI_API_KEY: "${LINGXI_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      ENABLE_WEB_SEARCH: "${ENABLE_WEB_SEARCH:-false}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-lingxi-admin}"
      ADMIN_TOKEN_TTL_SECONDS: "${ADMIN_TOKEN_TTL_SECONDS:-28800}"
      LINGXI_SECRET: "${LINGXI_SECRET:-lingxi-local-secret-change-me}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      TZ: Asia/Shanghai
    volumes:
      - lingxi_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: lingxi-mysql
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-lingxi_root_pass}"
      MYSQL_DATABASE: lingxi
      MYSQL_USER: lingxi
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-lingxi_pass}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

  redis:
    image: redis:7.4-alpine
    container_name: lingxi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: lingxi-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - "etcd"
      - "--advertise-client-urls=http://etcd:2379"
      - "--listen-client-urls=http://0.0.0.0:2379"
      - "--data-dir=/etcd"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: lingxi-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.8
    container_name: lingxi-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      COMMON_STORAGETYPE: minio
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  lingxi_data:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
